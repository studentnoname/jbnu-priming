<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>의미적 점화 효과 검증 — 발표자료</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;900&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f3f3f1; --ink: #1A1D31; --muted: #6E6C74; --line: #dcdbe0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: 'Gothic A1', sans-serif; min-height: 100vh; padding: 64px 16px; word-break: keep-all; }
  main { max-width: 960px; margin: 0 auto; }
  .kicker { font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: var(--muted); letter-spacing: .06em; }
  h1 { font-size: clamp(28px, 4.6vw, 44px); font-weight: 900; line-height: 1.25; margin: 14px 0 10px; letter-spacing: -.02em; }
  .lead { color: var(--muted); font-size: 17px; line-height: 1.6; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 40px; }
  a.card { display: block; text-decoration: none; color: inherit; background: #fff; border: 1px solid var(--line); overflow: hidden; transition: transform .2s ease, box-shadow .2s ease; }
  a.card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(26,29,49,.10); }
  .swatch { aspect-ratio: 16 / 9; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; padding: 20px; color: #fff; }
  .swatch b { font-size: 30px; font-weight: 900; letter-spacing: -.02em; }
  .swatch span { font-size: 15px; font-weight: 700; }
  .sw-7 { background: linear-gradient(90deg, #1A1D31 70%, #B05A43 70%); }
  .sw-7 span { color: #E0937D; }
  .sw-8 { background: linear-gradient(90deg, #1E4D52 70%, #2B6A70 70%); }
  .sw-8 span { color: #86C2BD; }
  .meta { padding: 16px 20px 20px; }
  .meta strong { display: block; font-size: 19px; font-weight: 900; }
  .meta code { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--muted); }
  footer { margin-top: 44px; color: var(--muted); font-size: 14px; line-height: 1.8; }
  kbd { font-family: 'IBM Plex Mono', monospace; border: 1px solid var(--line); padding: 0 6px; background: #fff; }
</style>
</head>
<body>
<main>
  <p class="kicker">전북대학교 『학습심리학』 · 2조</p>
  <h1>사전 노출된 단어의 의미 범주가 단어 어간 완성 과제에 미치는 영향</h1>
  <p class="lead">의미적 점화 효과 검증 — 색 시안 두 가지</p>
  <div class="grid">
    <a class="card" href="7/"><div class="swatch sw-7"><b>의미적 점화</b><span>+0.62 · p = .0087</span></div><div class="meta"><strong>7번 · 미드나잇 + 테라코타</strong><code>#1A1D31 · 강조 #B05A43</code></div></a>
    <a class="card" href="8/"><div class="swatch sw-8"><b>의미적 점화</b><span>+0.62 · p = .0087</span></div><div class="meta"><strong>8번 · 어두운 청록</strong><code>#1E4D52 · 강조 #2B6A70</code></div></a>
  </div>
  <footer>슬라이드 넘기기 <kbd>→</kbd> <kbd>Space</kbd> · 이전 <kbd>←</kbd> · 전체 화면 <kbd>F11</kbd> · 휴대폰에서는 좌우로 밀어서 넘겨요.</footer>
</main>
</body>
</html>
