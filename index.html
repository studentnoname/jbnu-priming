<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>의미적 점화 효과 검증 — 발표자료</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f4f2ec; --ink: #151515; --muted: #6a6a66; --line: #d9d6cc; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: 'IBM Plex Sans KR', sans-serif; min-height: 100vh; padding: 64px 16px; word-break: keep-all; }
  main { max-width: 1080px; margin: 0 auto; }
  .kicker { font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: var(--muted); letter-spacing: .08em; }
  h1 { font-size: clamp(30px, 5vw, 48px); line-height: 1.25; margin: 14px 0 10px; }
  .lead { color: var(--muted); font-size: 17px; line-height: 1.6; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 40px; }
  a.card { display: block; text-decoration: none; color: inherit; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: #fff; transition: transform .2s ease, box-shadow .2s ease; }
  a.card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,.08); }
  .swatch { aspect-ratio: 16 / 9; display: flex; align-items: flex-end; padding: 18px; font-size: 26px; font-weight: 700; }
  .sw-a { color: #111; border-bottom: 1px solid var(--line); background: linear-gradient(90deg, #fff 62%, #ff3300 62%); }
  .sw-b { background-color: #F0EBDE; color: #1F2BE0; background-image: linear-gradient(to right, rgba(31,43,224,.12) 1px, transparent 1px), linear-gradient(to bottom, rgba(31,43,224,.12) 1px, transparent 1px); background-size: 18px 18px; }
  .sw-c { background: radial-gradient(circle at 78% 30%, rgba(166,227,107,.35), transparent 40%), #0C100E; color: #A6E36B; }
  .meta { padding: 16px 18px 20px; }
  .meta strong { display: block; font-size: 18px; }
  .meta span { color: var(--muted); font-size: 14px; }
  footer { margin-top: 48px; color: var(--muted); font-size: 14px; line-height: 1.7; }
  kbd { font-family: 'IBM Plex Mono', monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; background: #fff; }
</style>
</head>
<body>
<main>
  <p class="kicker">전북대학교 『학습심리학』 · 2조</p>
  <h1>사전 노출된 단어의 의미 범주가 단어 어간 완성 과제에 미치는 영향</h1>
  <p class="lead">의미적 점화 효과 검증 — 같은 내용, 세 가지 디자인</p>
  <div class="grid">
    <a class="card" href="a/"><div class="swatch sw-a">단_</div><div class="meta"><strong>A · 스위스 모던</strong><span>흰 배경 · 굵은 검정 · 빨강 강조</span></div></a>
    <a class="card" href="b/"><div class="swatch sw-b">의미적 점화</div><div class="meta"><strong>B · 코발트 그리드</strong><span>모눈종이 · 코발트 한 가지 색</span></div></a>
    <a class="card" href="c/"><div class="swatch sw-c">자연 → 노_</div><div class="meta"><strong>C · 기억 네트워크</strong><span>어두운 배경 · 연두색 연결 노드</span></div></a>
  </div>
  <footer>슬라이드 넘기기: <kbd>→</kbd> <kbd>Space</kbd> · 이전: <kbd>←</kbd> · 전체 화면: <kbd>F11</kbd> · 휴대폰에서는 좌우로 밀어서 넘겨요.</footer>
</main>
</body>
</html>
